name: Scrape library jobs

permissions:
  contents: write

on:
  schedule:
    - cron: "0 13 * * *"  # daily at 13:00 UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python scrape_jobs.py

      - name: Debug - show jobs.csv + git state
        run: |
          echo "PWD:"
          pwd
          echo "List repo root:"
          ls -la
          echo "Find CSV files:"
          find . -maxdepth 4 -type f -name "*.csv" -print -exec ls -lah {} \;
          echo "Show jobs.csv preview (if exists):"
          ls -lah jobs.csv || true
          head -n 5 jobs.csv || true
          echo "Git status:"
          git status
          echo "Branch:"
          git branch --show-current || true

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push jobs.csv if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f jobs.csv ]; then
            echo "jobs.csv missing; nothing to commit"
            exit 0
          fi

          # Optional: avoid committing header-only files
          LINES=$(wc -l < jobs.csv | tr -d ' ')
          echo "jobs.csv line count: $LINES"
          if [ "$LINES" -le 1 ]; then
            echo "jobs.csv is empty (header only). Not committing."
            exit 0
          fi

          echo "Git status before add:"
          git status --porcelain

          git add jobs.csv

          echo "Staged diff stat:"
          git diff --staged --stat || true

          # If nothing staged, exit cleanly
          if git diff --staged --quiet; then
            echo "No changes in jobs.csv to commit."
            exit 0
          fi

          git commit -m "Update jobs.csv"

          # Push back to the same branch that triggered the workflow
          BRANCH="${GITHUB_REF_NAME}"
          echo "Pushing to branch: $BRANCH"
          git push origin "HEAD:$BRANCH"
